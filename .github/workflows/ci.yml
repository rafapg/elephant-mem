name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python tests/smoke.py
      - run: python tests/test_state.py
      - run: python tests/test_index.py
      - run: python tests/test_decay.py
      - run: python tests/test_hooks.py
      - run: python tests/test_wiki.py
